# Build and publish to Cloudflare Pages.
#
# Requires two repository-level secrets (Settings -> Secrets and variables ->
# Actions -> Secrets): CLOUDFLARE_API_TOKEN (a token with Pages edit
# permission) and CLOUDFLARE_ACCOUNT_ID. The "my-portfolio" Pages project must
# already exist before the first run — `wrangler pages deploy` only offers to
# create a missing project interactively, and this workflow is non-interactive.
# Create it once with `npx wrangler pages project create my-portfolio
# --production-branch=main` (requires `npx wrangler login` first).
#
#   vars.VITE_CONTACT_ENDPOINT      https://api.web3forms.com/submit
#   secrets.VITE_CONTACT_ACCESS_KEY the Web3Forms key
#
# Both are optional. Without them the site deploys and works; the contact form
# renders and validates but reports "not configured" on submit.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that is already publishing —
# a half-applied deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_CONTACT_ACCESS_KEY: ${{ secrets.VITE_CONTACT_ACCESS_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=my-portfolio
