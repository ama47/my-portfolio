<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdulaziz Alsuhaibani — Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-Stack Developer in Riyadh, Saudi Arabia. React.js, Python, C#, ASP.NET, PostgreSQL and AWS. Building scalable web applications and RESTful APIs."
    />
    <meta name="theme-color" content="#1D4ED8" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abdulaziz Alsuhaibani — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-Stack Developer in Riyadh. React.js, Python, C#, PostgreSQL, AWS."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Applied before React mounts so the page never flashes the wrong theme or
      text direction. Kept deliberately tiny and dependency-free.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio-theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') root.classList.add('dark');

          var locale = localStorage.getItem('portfolio-locale') || 'en';
          root.setAttribute('lang', locale);
          root.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          /* private mode / storage disabled — defaults in the markup stand */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
